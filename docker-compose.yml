---
services:
  swag:
    image: lscr.io/linuxserver/swag:latest
    container_name: swag
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=Etc/UTC
      - VALIDATION=duckdns
      - DUCKDNSTOKEN=${DUCKDNSTOKEN}
      - URL=magnumlab.duckdns.org
      - SUBDOMAINS=wildcard
      #- EXTRA_DOMAINS=cyberopslab.duckdns.org,www.cyberopslab.duckdns.org,ueccc.duckdns.org,www.ueccc.duckdns.org
      #- VALIDATION=http
      #- DNSPLUGIN=cloudflare
      #- REAL_IP_FROM=cloudflare
      - EMAIL=${EMAIL}
      - SWAG_AUTORELOAD=true          # Highly recommended!
    volumes:
      - ./swag-config:/config
      - uc_wp_data:/var/www/ueccc:ro
      - wp_data:/var/www/magnumlab:ro
      # Duckdns API works for a single domain, With EXTRA_DOMAINS you need to use VALIDATION=http to get a cert for multiple domains.
      #- ./duckdns.ini:/config/dns-conf/duckdns.ini:ro   
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # QUIC
    networks:
      - proxy_net
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    command:
      - "--trusted-origins=https://dash.magnumlab.duckdns.org"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - proxy_net
    restart: unless-stopped

networks:
  proxy_net:
    external: true

volumes:
  portainer_data:
  uc_wp_data:
    external: true
  wp_data:
    external: true